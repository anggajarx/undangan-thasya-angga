<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2e9de">
  <title>Halaman Tidak Tersedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --nude: #f3ebe1;
      --nude2: #e9ddce;
      --cream: #faf6f0;
      --ink: #3f352d;
      --muted: #7b6a5b;
      --gold: #a98b6b;
      --gold-soft: #d9bb90;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "DM Sans", "Segoe UI", Arial, sans-serif;
      --script: "Great Vibes", "Brush Script MT", cursive;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
      overflow-x: hidden; overflow-y: auto;
      color: var(--ink);
      font-family: var(--sans);
      text-align: center;
      background:
        radial-gradient(120% 90% at 50% 0%, #fbf6ef 0%, rgba(251, 246, 239, 0) 60%),
        linear-gradient(180deg, var(--nude) 0%, var(--nude2) 100%);
      -webkit-font-smoothing: antialiased;
    }

    /* Tekstur halus */
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .28  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Cahaya lembut yang bergerak pelan */
    .orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(60px); opacity: .55; will-change: transform; }
    .orb-1 { width: 340px; height: 340px; top: -90px; left: -80px; background: radial-gradient(circle, #e8cfae 0%, rgba(232, 207, 174, 0) 70%); animation: drift1 16s ease-in-out infinite; }
    .orb-2 { width: 380px; height: 380px; right: -110px; bottom: -110px; background: radial-gradient(circle, #ecc9bb 0%, rgba(236, 201, 187, 0) 70%); animation: drift2 19s ease-in-out infinite; }
    @keyframes drift1 { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(50px, 36px, 0); } }
    @keyframes drift2 { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(-46px, -34px, 0); } }

    /* Kartu kaca dengan border emas */
    .stage { position: relative; z-index: 1; width: min(100%, 460px); margin: auto; perspective: 1100px; }
    .card {
      position: relative; width: 100%;
      padding: 52px 34px 40px;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255, 252, 247, .82), rgba(247, 240, 231, .6));
      box-shadow: 0 40px 70px -34px rgba(62, 48, 37, .45), 0 4px 14px rgba(62, 48, 37, .06), inset 0 1px 0 rgba(255, 255, 255, .95);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .35s ease-out;
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) .1s both;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit; pointer-events: none;
      background: linear-gradient(135deg, #d9bb90 0%, #fffaf0 34%, rgba(169, 139, 107, .45) 64%, #d9bb90 100%);
      background-size: 260% 260%;
      animation: borderFlow 7s ease-in-out infinite alternate;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .card::after {
      content: ""; position: absolute; inset: 9px; border-radius: 22px; pointer-events: none;
      border: 1px solid rgba(169, 139, 107, .22);
    }
    .glare {
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s ease;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, 0) 55%);
    }
    .card.is-hover .glare { opacity: 1; }
    @keyframes borderFlow { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
    @keyframes rise { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
    @keyframes rv { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

    /* Ikon amplop */
    .icon { width: 92px; height: 92px; margin: 0 auto 22px; display: block; pointer-events: none; animation: float 5s ease-in-out infinite; }
    .icon .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.5s cubic-bezier(.4, 0, .2, 1) forwards; }
    .icon .d1 { animation-delay: .25s; }
    .icon .d2 { animation-delay: .6s; }
    .icon .d3 { animation-delay: 1s; }
    .icon .rays { opacity: 0; animation: rays 2.8s ease-in-out 1.6s infinite; }
    .icon .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: halo 3.6s ease-out 1.4s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rays { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes halo { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.35); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .eyebrow { margin: 0 0 10px; font-size: 10px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
    h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 9vw, 42px); line-height: 1.1; letter-spacing: .005em; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 20px auto 18px; width: 70%; }
    .divider i { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(169, 139, 107, 0), rgba(169, 139, 107, .6)); }
    .divider i:last-child { transform: scaleX(-1); }
    .divider b { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
    .lead { margin: 0 auto; max-width: 32ch; font-size: 15px; line-height: 1.75; color: var(--muted); }
    .lead + .lead { margin-top: 8px; }
    .sign { margin: 34px 0 0; font-family: var(--script); font-size: 30px; line-height: 1; color: var(--gold); }
    .date { margin: 10px 0 0; font-size: 10px; letter-spacing: .3em; color: var(--muted); }

    /* Penguncian elemen: teks, ikon, dan sorotan tidak bisa dipilih atau ditahan lama */
    html, body, body * {
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: transparent; color: inherit; }
    ::-moz-selection { background: transparent; color: inherit; }
    img, svg { -webkit-user-drag: none; user-drag: none; }
    :focus { outline: none; }

    .rv { animation: rv .8s cubic-bezier(.22, 1, .36, 1) calc(.5s + var(--i, 0) * .13s) both; }
    .sign {
      background: linear-gradient(100deg, #a98b6b 0%, #a98b6b 40%, #f3e0bd 50%, #a98b6b 60%, #a98b6b 100%);
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: rv .8s cubic-bezier(.22, 1, .36, 1) calc(.5s + var(--i, 0) * .13s) both, shimmer 5.5s ease-in-out 2.6s infinite;
    }
    @keyframes shimmer { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }

    /* Partikel kilau yang melayang naik */
    .sparks { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .spark {
      position: absolute; left: var(--x); bottom: -24px; width: var(--s); height: var(--s); border-radius: 50%;
      background: radial-gradient(circle, #fffaf0 0%, #e7c999 46%, rgba(231, 201, 153, 0) 72%);
      opacity: 0; will-change: transform, opacity;
      animation: sparkRise var(--t) linear var(--dl) infinite;
    }
    .spark.star { border-radius: 0; background: #e3c08d; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
    @keyframes sparkRise {
      0% { transform: translate3d(0, 0, 0) scale(.6); opacity: 0; }
      12% { opacity: var(--o, .9); }
      50% { transform: translate3d(var(--dx), -55vh, 0) scale(1); }
      100% { transform: translate3d(calc(var(--dx) * -.6), -118vh, 0) scale(.5); opacity: 0; }
    }

    @media (max-width: 420px) {
      .card { padding: 44px 24px 34px; border-radius: 26px; }
      .icon { width: 80px; height: 80px; }
      .lead { font-size: 14.5px; }
    }
    @media print { html, body { display: none !important; } }
    @media (prefers-reduced-motion: reduce) {
      .orb, .icon, .card, .card::before, .rv, .sign, .spark, .icon .rays, .icon .halo { animation: none !important; }
      .icon .draw { animation: none; stroke-dashoffset: 0; }
      .icon .rays { opacity: 1; }
      .sparks, .glare { display: none; }
      .card { transform: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <div class="sparks" id="sparks" aria-hidden="true"></div>

  <div class="stage">
  <main class="card">
    <span class="glare" aria-hidden="true"></span>
    <svg class="icon" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="10" y1="14" x2="86" y2="82" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#d9bb90"/>
          <stop offset=".5" stop-color="#a98b6b"/>
          <stop offset="1" stop-color="#d9bb90"/>
        </linearGradient>
      </defs>
      <circle class="halo" cx="48" cy="48" r="45" stroke="url(#g)" stroke-width="1"/>
      <circle class="draw d1" cx="48" cy="48" r="45" stroke="url(#g)" stroke-width="1" pathLength="1" opacity=".55"/>
      <rect class="draw d2" x="22" y="31" width="52" height="36" rx="5" stroke="url(#g)" stroke-width="2" pathLength="1"/>
      <path class="draw d3" d="M23 34l25 19 25-19" stroke="url(#g)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>
      <path class="rays" d="M48 17v6M40 20l2.5 4M56 20l-2.5 4" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <p class="eyebrow rv" style="--i:0">Undangan Pernikahan</p>
    <h1 class="rv" style="--i:1">Halaman Tidak Tersedia</h1>
    <div class="divider rv" style="--i:2" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="lead rv" style="--i:3">Tautan yang Anda buka tidak sesuai atau sudah tidak berlaku.</p>
    <p class="lead rv" style="--i:4">Gunakan tautan undangan yang kami kirim langsung kepada Anda.</p>

    <p class="sign" style="--i:5">Thasya &amp; Angga</p>
    <p class="date rv" style="--i:6">04 · 12 · 2026</p>
  </main>
  </div>

  <script>
    (function () {
      var stop = function (e) { e.preventDefault(); };

      // Menu tahan lama (Android, iOS) dan klik kanan (Windows, MacBook)
      document.addEventListener("contextmenu", stop);
      // Teks tidak bisa diblok atau dipilih
      document.addEventListener("selectstart", stop);
      // Elemen tidak bisa diseret
      document.addEventListener("dragstart", stop);
      // Salin dan potong
      document.addEventListener("copy", stop);
      document.addEventListener("cut", stop);

      // Pintasan simpan, cetak, lihat sumber, pilih semua, salin (Ctrl di Windows, Cmd di MacBook)
      document.addEventListener("keydown", function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        var k = (e.key || "").toLowerCase();
        if (k === "s" || k === "p" || k === "u" || k === "a" || k === "c" || k === "x") e.preventDefault();
      });

      // Safari iOS: cegah gestur zoom dengan dua jari yang memunculkan pilihan elemen
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
        document.addEventListener(t, stop);
      });
    })();
  </script>

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;

      // Partikel kilau (lebih sedikit di HP agar ringan)
      var wrap = document.getElementById("sparks");
      if (wrap) {
        var total = window.innerWidth < 600 ? 12 : 22;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < total; i++) {
          var star = i % 4 === 0;
          var s = document.createElement("i");
          s.className = "spark" + (star ? " star" : "");
          var size = star ? 8 + Math.random() * 7 : 4 + Math.random() * 6;
          var dur = 9 + Math.random() * 9;
          s.style.setProperty("--x", (Math.random() * 100).toFixed(1) + "%");
          s.style.setProperty("--s", size.toFixed(1) + "px");
          s.style.setProperty("--t", dur.toFixed(1) + "s");
          s.style.setProperty("--dl", (-Math.random() * dur).toFixed(1) + "s");
          s.style.setProperty("--dx", (Math.random() * 90 - 45).toFixed(0) + "px");
          s.style.setProperty("--o", (0.5 + Math.random() * 0.5).toFixed(2));
          frag.appendChild(s);
        }
        wrap.appendChild(frag);
      }

      // Miringkan kartu mengikuti kursor (laptop, MacBook, trackpad). Tidak aktif di layar sentuh.
      var fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      var card = document.querySelector(".card");
      if (!fine || !card) return;

      var raf = 0, rx = 0, ry = 0, mx = 50, my = 30;
      var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };

      function apply() {
        raf = 0;
        card.style.setProperty("--rx", rx.toFixed(2) + "deg");
        card.style.setProperty("--ry", ry.toFixed(2) + "deg");
        card.style.setProperty("--mx", mx.toFixed(1) + "%");
        card.style.setProperty("--my", my.toFixed(1) + "%");
      }

      document.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
        var r = card.getBoundingClientRect();
        var nx = clamp((e.clientX / window.innerWidth) * 2 - 1, -1, 1);
        var ny = clamp((e.clientY / window.innerHeight) * 2 - 1, -1, 1);
        ry = nx * 7;
        rx = -ny * 7;
        mx = clamp(((e.clientX - r.left) / r.width) * 100, 0, 100);
        my = clamp(((e.clientY - r.top) / r.height) * 100, 0, 100);
        card.classList.add("is-hover");
        if (!raf) raf = requestAnimationFrame(apply);
      }, { passive: true });

      function resetTilt() {
        rx = 0; ry = 0;
        card.classList.remove("is-hover");
        if (!raf) raf = requestAnimationFrame(apply);
      }
      document.documentElement.addEventListener("mouseleave", resetTilt);
      window.addEventListener("blur", resetTilt);
    })();
  </script>
</body>
</html>
